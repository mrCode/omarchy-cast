[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omarchy-cast"
version = "0.3.0"
description = "Desktop mirroring for Omarchy to AirPlay and Google Cast receivers"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PyChromecast>=14", "zeroconf>=0.140", "textual>=1.0"]

[project.scripts]
omarchy-cast = "omarchy_cast.cli.main:main"
omarchy-castd = "omarchy_cast.core.daemon:main"
omarchy-cast-tui = "omarchy_cast.tui.app:main"

[tool.setuptools.packages.find]
include = ["omarchy_cast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Without this the package is only importable after an install; pytest puts the
# tests dir on sys.path, not the project root.
pythonpath = ["."]
asyncio_mode = "auto"
